<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="/login.css">
    <link rel="icon" href="/img/logo.png" type="image/x-icon">
</head>
<body>

<div class="container">

    <h1>Registro de Usuario</h1>

    <form th:action="@{/registrar}"
          method="post"
          th:object="${admin}">

        <input type="text"
               th:field="*{username}"
               placeholder="Usuario"
               required>

        <input type="password"
               th:field="*{password}"
               placeholder="Contraseña"
               required>

        <button type="submit">
            Registrarse
        </button>

    </form>

    <br>

    <a th:href="@{/}">
        Volver al Login
    </a>

</div>

</body>
</html>
